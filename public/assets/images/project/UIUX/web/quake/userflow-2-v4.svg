<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1340" viewBox="0 0 1920 1340" font-family="Noto Sans TC, PingFang TC, Hanken Grotesk, sans-serif">
<defs><marker id="ar" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0,0 L10,5.5 L0,11 Z" fill="#d3f04b"/></marker></defs>
<rect width="1920" height="1340" fill="#141414"/>
<rect x="90" y="52" width="96" height="46" rx="23" fill="#d3f04b"/>
<text x="138" y="84" text-anchor="middle" font-size="24" font-weight="700" fill="#20220f">震前</text>
<text x="212" y="90" text-anchor="start" font-size="42" font-weight="700" fill="#ecede4">日常防震準備</text>
<text x="90" y="165" text-anchor="start" font-size="24" font-weight="400" fill="#a0a196">從首頁「防震準備」進入，三個模組獨立運作、各自可完成。設計邏輯是把「準備」拆成小任務：清單化、給提醒、</text>
<text x="90" y="203" text-anchor="start" font-size="24" font-weight="400" fill="#a0a196">可反覆練習，讓防災變成日常就能維護的事。</text>
<rect x="90" y="238" width="1740" height="74" rx="16" fill="none" stroke="#3c3e33" stroke-width="1.5"/>
<rect x="122" y="264" width="22" height="22" rx="6" fill="#d3f04b"/>
<text x="160" y="283" text-anchor="start" font-size="22" font-weight="400" fill="#a0a196">模組進入點</text>
<rect x="316" y="264" width="22" height="22" rx="6" fill="none" stroke="#a0a196" stroke-width="2"/>
<text x="354" y="283" text-anchor="start" font-size="22" font-weight="400" fill="#a0a196">App 畫面</text>
<polygon points="505,264 518,275 505,286 492,275" fill="none" stroke="#d3f04b" stroke-width="2"/>
<text x="536" y="283" text-anchor="start" font-size="22" font-weight="400" fill="#a0a196">系統判斷</text>
<rect x="698" y="264" width="22" height="22" rx="6" fill="#3c3e33"/>
<text x="736" y="283" text-anchor="start" font-size="22" font-weight="400" fill="#a0a196">模組完成</text>
<text x="90" y="388" text-anchor="start" font-size="26" font-weight="700" fill="#d3f04b">模組 1・防災包管理</text>
<text x="384" y="388" text-anchor="start" font-size="21" font-weight="400" fill="#a0a196">邏輯：先知道家裡需要什麼，再追蹤有沒有備齊、會不會過期</text>
<rect x="90" y="416" width="330" height="176" rx="22" fill="#d3f04b"/>
<text x="255.0" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#20220f">設定家庭成員</text>
<text x="255.0" y="512" text-anchor="middle" font-size="20" font-weight="400" fill="#3a3d1e">人數・嬰幼兒・寵物</text>
<text x="255.0" y="544" text-anchor="middle" font-size="20" font-weight="400" fill="#3a3d1e">慢性病等特殊需求</text>
<rect x="570" y="416" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="735.0" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">客製化物資清單</text>
<text x="735.0" y="512" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">食品・飲水・醫療</text>
<text x="735.0" y="544" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">證件，而非通用清單</text>
<rect x="1050" y="416" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#d3f04b" stroke-width="2.5"/>
<text x="1215.0" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#d3f04b">缺項／效期偵測</text>
<text x="1215.0" y="512" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">盤點完成度</text>
<text x="1215.0" y="544" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">與各品項效期</text>
<rect x="1530" y="416" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="1695.0" y="470" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">提醒補齊・更新</text>
<text x="1695.0" y="512" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">點擊提醒回到清單</text>
<text x="1695.0" y="544" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">形成維護循環</text>
<text x="495.0" y="484" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">系統依成員生成</text>
<path d="M 426 504 H 562" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="975.0" y="484" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">逐項確認</text>
<path d="M 906 504 H 1042" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1455.0" y="484" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">到期前推播</text>
<path d="M 1386 504 H 1522" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M 90 644 H 1830" stroke="#2c2d26" stroke-width="1.5"/>
<text x="90" y="706" text-anchor="start" font-size="26" font-weight="700" fill="#d3f04b">模組 2・家具固定自檢</text>
<text x="411" y="706" text-anchor="start" font-size="21" font-weight="400" fill="#a0a196">邏輯：先盤點居家風險，再教會使用者怎麼處理</text>
<rect x="90" y="734" width="330" height="176" rx="22" fill="#d3f04b"/>
<text x="255.0" y="788" text-anchor="middle" font-size="26" font-weight="700" fill="#20220f">選擇居家空間</text>
<text x="255.0" y="830" text-anchor="middle" font-size="20" font-weight="400" fill="#3a3d1e">客廳・臥室・廚房</text>
<text x="255.0" y="862" text-anchor="middle" font-size="20" font-weight="400" fill="#3a3d1e">逐空間檢查</text>
<rect x="570" y="734" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#d3f04b" stroke-width="2.5"/>
<text x="735.0" y="788" text-anchor="middle" font-size="26" font-weight="700" fill="#d3f04b">固定狀態判斷</text>
<text x="735.0" y="830" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">櫃體・電器・吊掛物</text>
<text x="735.0" y="862" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">是否已固定</text>
<rect x="1050" y="734" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="1215.0" y="788" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">動態翻卡教學</text>
<text x="1215.0" y="830" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">對應家具的固定方式</text>
<text x="1215.0" y="862" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">示範與所需工具</text>
<rect x="1530" y="734" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="1695.0" y="788" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">完成標記</text>
<text x="1695.0" y="830" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">累計居家安全完成度</text>
<text x="1695.0" y="862" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">未完成項目保留提醒</text>
<text x="495.0" y="802" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">逐項檢查</text>
<path d="M 426 822 H 562" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="975.0" y="802" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">未固定項目</text>
<path d="M 906 822 H 1042" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1455.0" y="802" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">處理完成後</text>
<path d="M 1386 822 H 1522" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<path d="M 90 962 H 1830" stroke="#2c2d26" stroke-width="1.5"/>
<text x="90" y="1024" text-anchor="start" font-size="26" font-weight="700" fill="#d3f04b">模組 3・互動式模擬演練</text>
<text x="438" y="1024" text-anchor="start" font-size="21" font-weight="400" fill="#a0a196">邏輯：用隨機情境模擬真實的不可預期，練完給檢討</text>
<rect x="90" y="1052" width="330" height="176" rx="22" fill="#d3f04b"/>
<text x="255.0" y="1106" text-anchor="middle" font-size="26" font-weight="700" fill="#20220f">選擇演練模式</text>
<text x="255.0" y="1148" text-anchor="middle" font-size="20" font-weight="400" fill="#3a3d1e">自選情境</text>
<text x="255.0" y="1180" text-anchor="middle" font-size="20" font-weight="400" fill="#3a3d1e">或隨機模擬</text>
<rect x="570" y="1052" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="735.0" y="1106" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">情境組合</text>
<text x="735.0" y="1148" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">地區 × 建築類型 ×</text>
<text x="735.0" y="1180" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">樓層 × 時間情境</text>
<rect x="1050" y="1052" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="1215.0" y="1106" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">模擬警報演練</text>
<text x="1215.0" y="1148" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">照震時流程實際操作</text>
<text x="1215.0" y="1180" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">掩護或避難的判斷</text>
<rect x="1530" y="1052" width="330" height="176" rx="22" fill="#1e1f1a" stroke="#3c3e33" stroke-width="1.5"/>
<text x="1695.0" y="1106" text-anchor="middle" font-size="26" font-weight="700" fill="#ecede4">後設反思</text>
<text x="1695.0" y="1148" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">檢討本次選擇</text>
<text x="1695.0" y="1180" text-anchor="middle" font-size="20" font-weight="400" fill="#a0a196">給出改進建議</text>
<text x="495.0" y="1120" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">隨機模式自動生成</text>
<path d="M 426 1140 H 562" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="975.0" y="1120" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">開始演練</text>
<path d="M 906 1140 H 1042" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
<text x="1455.0" y="1120" text-anchor="middle" font-size="19" font-weight="400" fill="#ecede4">演練結束</text>
<path d="M 1386 1140 H 1522" fill="none" stroke="#6b6d5e" stroke-width="2.5" marker-end="url(#ar)"/>
</svg>
